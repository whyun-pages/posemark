<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(120% 140% at 0% 0%, #4677f5 0%, #2a4fc0 45%, #18307e 100%);
    color: #fff; position: relative;
  }
  .text { position: absolute; left: 72px; top: 92px; width: 470px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 84px; height: 84px; }
  .brand span { font-size: 58px; font-weight: 700; letter-spacing: -.5px; }
  h1 { margin: 44px 0 14px; font-size: 40px; line-height: 1.25; font-weight: 700; }
  p { margin: 0; font-size: 23px; line-height: 1.5; color: rgba(255,255,255,.82); }
  .bar { margin-top: 34px; width: 120px; height: 8px; border-radius: 4px; background: #ff8a3d; }
  .shot {
    position: absolute; left: 600px; top: 78px; width: 760px; border-radius: 12px; overflow: hidden;
    box-shadow: 0 30px 70px rgba(5, 15, 50, .5), 0 0 0 1px rgba(255,255,255,.18);
    transform: perspective(1600px) rotateY(-12deg) rotateX(3deg);
    transform-origin: left center;
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../assets/logo.svg" alt=""><span>Posemark</span></div>
    <h1>所见即所得的<br>Markdown 编辑器</h1>
    <p>Live-preview Markdown editor<br>for Windows · macOS · Linux</p>
    <div class="bar"></div>
  </div>
  <div class="shot"><img src="../assets/screenshots/editor-zh.jpg" alt=""></div>
</body>
</html>
